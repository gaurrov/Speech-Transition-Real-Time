[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "translator-nllb"
version = "0.1.0"
description = "Internal NLLB-200 translation service for the Real-Time Translator."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "structlog>=24.1",
    "torch>=2.2",
    "transformers>=4.40",
    "sentencepiece>=0.2",
]

[tool.setuptools]
packages = ["app"]
