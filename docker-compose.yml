# Local Docker development stack.
#
#   docker compose up --build
#
# - frontend:  nginx serving the production React build + WebSocket proxy
# - backend:   FastAPI + uvicorn (published on :8000 for local tooling)
# - nllb:      NLLB-200 translation service (always starts with the stack)
#
# Provider API keys come from the .env file (see .env.example). The stack
# starts without one; /health and the UI simply report the providers as
# unconfigured.
name: translator-dev

services:
  frontend:
    build:
      context: ./frontend
    ports:
      - "8080:80"
    environment:
      # Empty host -> the browser connects same-origin (this nginx), which
      # proxies /ws/* and /api/* to the backend.
      BACKEND_HOST: ${BACKEND_HOST:-}
      BACKEND_USE_TLS: ${BACKEND_USE_TLS:-false}
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    init: true
    env_file:
      - path: .env
        required: false
    environment:
      ENVIRONMENT: development
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_FORMAT: console
      PORT: "8000"
      TRANSLATION_PROVIDER: ${TRANSLATION_PROVIDER:-nllb}
      NLLB_SERVICE_URL: http://nllb:8001
    ports:
      - "${BACKEND_PORT:-18000}:8000"
    depends_on:
      nllb:
        condition: service_healthy
    restart: unless-stopped

  nllb:
    build:
      context: ./nllb
    init: true
    volumes:
      - nllb-models:/models
    environment:
      HF_HOME: /models
      NLLB_MODEL_NAME: ${NLLB_MODEL_NAME:-facebook/nllb-200-distilled-600M}
      NLLB_DEVICE: ${NLLB_DEVICE:-cpu}
      NLLB_WARM_START: "true"
      NLLB_REQUEST_TIMEOUT: ${NLLB_REQUEST_TIMEOUT:-30}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=4)"]
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 5
    restart: unless-stopped

volumes:
  nllb-models:
